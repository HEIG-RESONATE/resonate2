[project]
name = "resonate2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "pymongo>=4.10.0",
    "mongoengine>=0.29.0",
    "dnspython>=2.7.0",
    "python-jose[cryptography]>=3.3.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.12",
    "rasterio>=1.4",
    "argon2-cffi>=23.1.0",
    "slowapi>=0.1.9",
    "filetype>=1.2.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3",
    "httpx>=0.28",
    "mongomock>=4.1",
    "python-multipart>=0.0.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 95

[dependency-groups]
dev = [
    "plantuml>=0.3.0",
]
test = [
    "pytest-cov>=7.1.0",
]
