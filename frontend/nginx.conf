server {
    listen 80;
    server_name localhost;
    client_max_body_size 50M;

    auth_basic "RESONATE — restricted";
    auth_basic_user_file /etc/nginx/.htpasswd;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: http://unpkg.com; frame-src 'self' http: https:; connect-src 'self' http: https: ws: wss:;" always;
    location = /healthz {
        auth_basic off;
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /api {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /images {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    # Chainlit agent, same-origin. The agent runs with --root-path /chat and
    # serves all routes under that prefix, so the URI is passed through
    # unstripped (no trailing slash on proxy_pass).
    location /chat {
        # Any add_header here suppresses ALL inherited server-level headers,
        # so the full set is restated. The server-level X-Frame-Options DENY
        # must not apply: the SPA embeds this page in a same-origin iframe.
        # The CSP is relaxed for Chainlit's UI (KaTeX from jsdelivr, Google
        # fonts, websockets).
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https: ws: wss:; frame-ancestors 'self';" always;

        proxy_pass http://agent:8000;

        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}

# DEPRECATED — slated for removal. The chat UI is served same-origin under
# /chat on port 80; this vhost is kept only as a fallback until /chat is
# confirmed working in production.
server {
    listen 8080;
    server_name _;

    auth_basic "RESONATE Agent";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # The agent serves under /chat (--root-path); send the old bookmark there.
    location = / {
        return 302 /chat/;
    }

    location / {
        proxy_pass http://agent:8000;

        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
