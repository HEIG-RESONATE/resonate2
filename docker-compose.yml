services:
  api:
    build: .
    ports:
      - "127.0.0.1:8081:8000"
    volumes:
      - .:/app
      - images-data:/app/images
    env_file:
      - .env
    environment:
      - MONGO_HOST=mongodb://resonate:${MONGO_PASSWORD}@mongodb:27017/resonate?authSource=admin
    command: uvicorn main:app --host 0.0.0.0 --reload
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./frontend
      args:
        VITE_CHAINLIT_URL: ${VITE_CHAINLIT_URL}
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/app
      - ./frontend/.htpasswd:/etc/nginx/.htpasswd:ro
    depends_on:
      - api

  mongodb:
    image: mongo:7.0
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: resonate
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
  images-data:
