services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - images-data:/app/images
    environment:
      - MONGO_HOST=mongodb
    command: uvicorn main:app --host 0.0.0.0 --reload
    depends_on:
      - mongodb

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    volumes:
      - ./frontend:/app
    depends_on:
      - api

  mongodb:
    image: mongo:7.0
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
  images-data:
