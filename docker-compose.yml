services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - images-data:/app/images
    env_file:
      - .env
    environment:
      - MONGO_HOST=mongodb://resonate:${MONGO_PASSWORD}@mongodb:27017/resonate?authSource=admin
    command: uvicorn main:app --host 0.0.0.0 --reload
    depends_on:
      - mongodb

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    volumes:
      - ./frontend:/app
    depends_on:
      - api

  mongodb:
    image: mongo:7.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: resonate
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
  images-data:
